input_dir: video
output_dir: results
replicate: 16
warmup_videos: 4
seed: 42
# DOVER и Qwen одновременно: vLLM берёт 50% VRAM, DOVER живёт в остатке.
parallel: true
# Пул потоков torch и OpenCV на процесс; 0 — не трогать (по числу ядер).
# 2 вместе с dover.decode_workers 16 замедлили DOVER (results_v4: 242 → 269 с).
cpu_threads: 0

dover:
  weights: weights/DOVER.pth
  config: third_party/DOVER/dover.yml
  device: auto
  batch_size: 8
  # Непрерывный пул ffmpeg по одному потоку. 16 оказалось медленнее 8 (results_v4).
  decode_workers: 8
  # cpu — ffmpeg → numpy → нарезка в Python. nvdec — torchcodec на GPU, виды
  # собираются тензорно; при ошибке ролик уходит в cpu. Паритет: scripts/dover_parity.py
  # (±2 уровня на входе, overall ≤ 0.013). Этап DOVER 242 → 34 с (results_v6).
  decoder: nvdec

qwen:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  prompt: "Сгенерируй детальное описание всего, что происходит на видео"
  # Системное сообщение перед prompt; сам prompt уходит дословно. Пусто — без него.
  # С ним 45–125 слов вместо 105–400, без «Кадр N» и заголовков, 0 зацикленных
  # из 160, запрос 8.5 → 1.9 с (results_v10 → results_v11).
  system_prompt: >-
    Ты кратко и точно описываешь видео. Пиши связным текстом, без заголовков, списков
    и нумерации кадров. Скажи, кто и что в кадре и что происходит, в порядке событий.
    Если текст на экране читается, приведи его дословно; если не читается, не придумывай.
    Не повторяй то, что не меняется, и не додумывай смысл. Объём по содержанию:
    2–4 предложения для простой сцены, до 8 для насыщенной.
  num_frames: 8
  max_side: 384
  # 512 обрезал 9 из 10 описаний, 1024 — 6 из 8 копий 3.mp4 (430 слов, без повторов).
  # 8×384 — ~750 токенов промпта, с 1536 новыми влезает в max_model_len 4096.
  max_tokens: 1536
  temperature: 0.3
  # 1.0 — без штрафа. 1.1 режет зацикливание, но подозревается в ошибках
  # окончаний («Пятнадцатое» вместо «Пятое»): см. configs/ab_*.yaml.
  repetition_penalty: 1.1
  # Штраф за уже встречавшийся токен, один раз, без умножения на число повторов.
  presence_penalty: 0.0
  # Фиксированный seed запроса. Побайтной воспроизводимости он не даёт: vLLM считает
  # logits по-разному при разном составе батча, и при temperature > 0 текст расходится
  # (v3 и v5 совпадают на первых ~100 словах 1.mp4). Сравнивать по caption_stats.
  seed: 42
  # images — 8 отдельных картинок. video — те же кадры одним роликом с метками времени:
  # без перечисления «Кадр N», но в 2–4 раза короче и с выдуманным текстом на 8 кадрах,
  # соседние кадры склеиваются попарно (results_v7). 16 кадров видео — ещё хуже:
  # 1.mp4 зациклен в 14 из 16 копий, остальные по 35–160 слов (results_v9).
  input: images
  # Кадры Qwen: cpu — ffmpeg, nvdec — torchcodec на GPU. Ожидание кадров 43 → 11 с,
  # весь прогон 85.5 → 60 с (results_v6 → results_v8).
  decoder: nvdec
  # Роликов пачки, которые готовятся к Qwen параллельно. 1 — по одному, как раньше.
  # 8 сократили этап Qwen с 217 до 136 с (results_v4).
  decode_workers: 8
  # true — без пачек: каждый ролик «кадры → запрос» сам по себе, в vLLM до
  # max_num_seqs запросов. false — пачки по batch_size, пачка ждёт самый длинный ответ.
  # Вместе с max_num_seqs 64: весь прогон 60 → 50 с, качество как было (results_v10).
  continuous: true
  batch_size: 32
  attn_implementation: auto
  # При parallel: true пайплайн сам режет долю до 0.50 (OVERLAP_VLLM_FRACTION), чтобы рядом жил DOVER.
  backend: vllm
  dtype: bfloat16
  max_model_len: 4096
  max_num_seqs: 64
  gpu_memory_utilization: 0.90
  port: 8000
  api_base: ""
