input_dir: video
output_dir: results
replicate: 16
warmup_videos: 4
seed: 42
# DOVER и Qwen одновременно: vLLM берёт 50% VRAM, DOVER живёт в остатке.
parallel: true
# Пул потоков torch и OpenCV на процесс; 0 — не трогать (по числу ядер).
# Тензорные операции идут сразу из многих воркеров декода, и пулы по числу ядер
# в каждом дают переподписку: в vmstat sy > us и до 1.2 млн переключений/с.
cpu_threads: 2

dover:
  weights: weights/DOVER.pth
  config: third_party/DOVER/dover.yml
  device: auto
  batch_size: 8
  # Непрерывный пул ffmpeg по одному потоку. С 8 воркерами CPU простаивал на ~2/3.
  decode_workers: 16

qwen:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  prompt: "Сгенерируй детальное описание всего, что происходит на видео"
  num_frames: 8
  max_side: 384
  # 512 обрезал 9 из 10 описаний, 1024 — 6 из 8 копий 3.mp4 (430 слов, без повторов).
  # 8×384 — ~750 токенов промпта, с 1536 новыми влезает в max_model_len 4096.
  max_tokens: 1536
  temperature: 0.3
  # 1.0 — без штрафа. 1.1 режет зацикливание, но подозревается в ошибках
  # окончаний («Пятнадцатое» вместо «Пятое»): см. configs/ab_*.yaml.
  repetition_penalty: 1.1
  # Штраф за уже встречавшийся токен, один раз, без умножения на число повторов.
  presence_penalty: 0.0
  # Фиксированный seed запроса: при temperature > 0 подписи воспроизводимы, A/B честный.
  seed: 42
  # Роликов пачки, которые готовятся к Qwen параллельно. 1 — по одному, как раньше
  # (~170 из 217 с этапа Qwen уходило на эту подготовку).
  decode_workers: 8
  batch_size: 32
  attn_implementation: auto
  # При parallel: true пайплайн сам режет долю до 0.55, чтобы рядом жил DOVER.
  backend: vllm
  dtype: bfloat16
  max_model_len: 4096
  max_num_seqs: 32
  gpu_memory_utilization: 0.90
  port: 8000
  api_base: ""
